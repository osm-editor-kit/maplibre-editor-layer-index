name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint-check

      - name: Build package
        run: bun run build

      - name: Typecheck
        run: |
          bun run --filter @osm-editor-kit/maplibre-editor-layer-index type-check
          bun run --filter preview type-check

      - name: Size budget
        run: bun run --filter @osm-editor-kit/maplibre-editor-layer-index check-size

      - name: Test
        run: bun run test-run

      - name: Check exports (attw)
        run: bun run check-exports
